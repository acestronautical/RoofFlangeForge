name: Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    reproducibility:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install OpenSCAD (nightly AppImage)
              # Ubuntu's apt ships an ancient CGAL-only openscad (~2019.05)
              # whose boolean output isn't byte-deterministic across runs for
              # our bolt-hole configs (hash-set iteration order in CGAL leaks
              # into the STL layout). The snapshot builds ship Manifold as the
              # default engine, which is deterministic. Grab the latest.
              run: |
                  sudo apt-get update -qq
                  # fuse/libfuse2 -- run the AppImage; libegl1/libgl1/libglx-mesa0
                  # + xcb libs -- Qt/GL runtime deps openscad-nightly links
                  # against even in headless CLI mode.
                  sudo apt-get install -y -qq \
                      fuse libfuse2 wget \
                      libegl1 libgl1 libglx-mesa0 libopengl0 \
                      libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                      libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
                      libxkbcommon-x11-0 libdbus-1-3 libnss3
                  latest=$(curl -sSL https://files.openscad.org/snapshots/ \
                      | grep -oE 'OpenSCAD-[0-9.]+\.ai[0-9]+-x86_64\.AppImage' \
                      | sort -u | tail -1)
                  echo "Using $latest"
                  wget -q "https://files.openscad.org/snapshots/${latest}" -O openscad.AppImage
                  chmod +x openscad.AppImage
                  ./openscad.AppImage --appimage-extract > /dev/null
                  sudo mv squashfs-root /opt/openscad
                  # Symlinking AppRun breaks its relative apprun-hooks lookup,
                  # so drop a wrapper that sets APPDIR and execs AppRun with
                  # the caller's original working directory + args.
                  sudo tee /usr/local/bin/openscad > /dev/null <<'EOF'
                  #!/bin/bash
                  export APPDIR=/opt/openscad
                  exec "$APPDIR/AppRun" "$@"
                  EOF
                  sudo chmod +x /usr/local/bin/openscad
                  openscad --version

            - name: Reproducibility test
              run: bash cli/tests/reproducibility.sh
