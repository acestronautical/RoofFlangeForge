name: Build openscad-wasm from main

# Manually triggered from the Actions tab. Fetches the openscad/openscad-wasm
# repo at the current `main`, builds it inside Docker (Ubuntu runners already
# have Docker and gmake), and both uploads the artifacts and opens a PR that
# drops them into web/public/openscad/ so upgrading is a one-click review.
on:
    workflow_dispatch:
        inputs:
            openscad_wasm_ref:
                description: Ref of openscad/openscad-wasm to build
                required: false
                default: main

permissions:
    contents: write
    pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v4

            - name: Check out openscad-wasm
              uses: actions/checkout@v4
              with:
                  repository: openscad/openscad-wasm
                  ref: ${{ inputs.openscad_wasm_ref }}
                  path: openscad-wasm
                  submodules: recursive

            - name: Patch flaky mirrors
              working-directory: openscad-wasm
              # gmplib.org routinely rate-limits or blocks CI IPs; swap in the
              # GNU FTP mirror, which is far more reliable from GitHub runners.
              # Also make every wget in the Makefile retry hard so a transient
              # blip doesn't kill a 30-minute build.
              run: |
                  sed -i \
                      -e 's|https://gmplib.org/download/gmp/|https://ftp.gnu.org/gnu/gmp/|g' \
                      Makefile
                  sed -i -E 's|\bwget +-O|wget --tries=5 --timeout=30 --waitretry=15 -O|g' Makefile
                  grep -E "gmp-6\\.3\\.0|wget --tries" Makefile || true

            - name: Build openscad-wasm
              working-directory: openscad-wasm
              # The Makefile does a Docker-based Emscripten build; the runner
              # comes with Docker preinstalled and `make` is GNU make, so no
              # extra setup is needed.
              run: make all

            - name: Collect artifacts
              # openscad-wasm's main-branch build lands everything (openscad.js,
              # openscad.wasm.js, openscad.wasm, openscad.fonts.js, and the
              # generated .d.ts files) in `build/`. Older releases used `dist/`,
              # so fall back if `build/` isn't there.
              run: |
                  mkdir -p artifacts/openscad
                  if [ -d openscad-wasm/build ]; then src=openscad-wasm/build
                  elif [ -d openscad-wasm/dist ]; then src=openscad-wasm/dist
                  else echo "No build or dist directory in openscad-wasm/" >&2; exit 1
                  fi
                  echo "Source: $src"
                  ls -lh "$src"
                  cp -a "$src"/. artifacts/openscad/
                  echo "---"
                  ls -lh artifacts/openscad

            - name: Upload as workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: openscad-wasm-${{ inputs.openscad_wasm_ref }}
                  path: artifacts/openscad/

            - name: Copy into web/public/openscad/
              # Nuke the old vendored bundle before dropping the new one so a
              # renamed/removed upstream file doesn't linger.
              run: |
                  rm -rf web/public/openscad/*
                  cp -a artifacts/openscad/. web/public/openscad/

            - name: Open PR
              uses: peter-evans/create-pull-request@v6
              with:
                  branch: chore/openscad-wasm-upgrade
                  title: "chore: upgrade openscad-wasm to ${{ inputs.openscad_wasm_ref }}"
                  body: |
                      Rebuilt `openscad-wasm` from `${{ inputs.openscad_wasm_ref }}`
                      and dropped the fresh artifacts into `web/public/openscad/`.

                      Full artifacts also available as the workflow's uploaded artifact
                      (`openscad-wasm-${{ inputs.openscad_wasm_ref }}`).

                      Merge to upgrade production.
                  commit-message: "chore: upgrade openscad-wasm to ${{ inputs.openscad_wasm_ref }}"
